edition = "2023";

package protomorphic.conformance.foundation.v1;

import "protomorphic/conformance/ui/v1/ui.proto";
import "protomorphic/options.proto";

option java_package = "studio.dabble.protomorphic.conformance.foundation.v1";
option features.field_presence = IMPLICIT;
option (protomorphic.library) = {
  name: "conformance_foundation"
  extension_start: 1000
  extension_end: 1999
  dependencies: "conformance_ui"
};

// A rounded rectangle.
message RoundedCornerShape {
  float radius_dp = 1;
}

message CircleShape {}

extend protomorphic.conformance.ui.v1.Shape {
  // Implements Shape.
  RoundedCornerShape rounded_corner = 1000;
  CircleShape circle = 1001;
}

// Implements Named: declares its `name` (at its own number) alongside its own fields.
message Person {
  int32 age = 1;
  string name = 2;
}

extend protomorphic.conformance.ui.v1.Named {
  Person person = 1000;
}

// Implements Function<Square.Input, Square.Output>.
message Square {
  message Input {
    int32 x = 1;
  }
  message Output {
    int32 y = 1;
  }

  Input input = 1;
}

extend protomorphic.conformance.ui.v1.Function {
  Square square = 1000;
}

message Label {
  string text = 1;
}

extend protomorphic.conformance.ui.v1.Tagged {
  Label label = 1000;
}
