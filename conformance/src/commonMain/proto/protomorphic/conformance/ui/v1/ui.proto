edition = "2023";

package protomorphic.conformance.ui.v1;

import "protomorphic/options.proto";

option java_package = "com.dabble.protomorphic.conformance.ui.v1";
option features.field_presence = IMPLICIT;
option (protomorphic.library) = {
  name: "conformance_ui"
  extension_start: 1
  extension_end: 999
};

// An interface: implemented by other libraries, never importing them.
message Shape {
  option (protomorphic.interface) = true;

  extensions 1 to max;
}

// ui's own implementation of its interface.
message RectangleShape {}

extend Shape {
  RectangleShape rectangle = 1;
}

// An interface with an abstract field, like a Kotlin interface property: every implementation
// declares `name`, and Named itself never carries it.
message Named {
  option (protomorphic.interface) = true;

  // The name every implementation has.
  string name = 1;

  extensions 100 to max;
}

message Greeting {
  Named who = 1;
}

// Two interfaces one message implements under the same name. Extensions declared inside a message
// are scoped to it (Horizontal.center, Vertical.center), so their names do not clash.
message Horizontal {
  option (protomorphic.interface) = true;

  extend Horizontal {
    Centered center = 1;
  }

  extensions 1 to max;
}

message Vertical {
  option (protomorphic.interface) = true;

  extend Vertical {
    Centered center = 1;
  }

  extensions 1 to max;
}

// Implements both Horizontal and Vertical.
message Centered {}

message Axes {
  Horizontal horizontal = 1;
  Vertical vertical = 2;
}

// An interface with abstract types, like a Kotlin interface's type parameters: Function<Input, Output>.
// Every implementation declares its own Input and Output, and `input` has the implementation's Input.
message Function {
  option (protomorphic.interface) = true;

  message Input {}
  message Output {}

  Input input = 1;

  extensions 100 to max;
}

message Call {
  Function function = 1;
}

message ClipModifier {
  Shape shape = 1;
}

// An extendable message that is not an interface: it has fields, and extensions add more.
message Tagged {
  int32 id = 1;

  extensions 1000 to max;
}
