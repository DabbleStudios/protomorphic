edition = "2023";

package protomorphic.conformance.v1;

import "protomorphic/conformance/v1/editions.proto";

option java_package = "com.dabble.protomorphic.conformance.v1";
// A common setup: editions with proto3-style implicit presence, opting fields into explicit
// presence where "unset" must differ from zero.
option features.field_presence = IMPLICIT;

message ImplicitPresence {
  int32 count = 1;
  string name = 2;
  float ratio = 3;
  Mode mode = 4;
  int32 explicit_count = 5 [features.field_presence = EXPLICIT];
}
